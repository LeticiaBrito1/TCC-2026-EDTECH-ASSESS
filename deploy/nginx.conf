server {
    listen 80;
    server_name edtech-assess.duckdns.org 54.227.184.231 _;

    # Frontend — arquivos estáticos do build do React
    root /var/www/edtech/dist;
    index index.html;

    # Aumentar limite para upload de imagens (OCR)
    client_max_body_size 20M;

    # Proxy para o backend Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout alto para OCR (pode demorar até 180s)
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        send_timeout          300s;
    }

    # SPA — todas as rotas que não existem servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Força download do APK Android
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=edtech-app.apk" always;
    }

    # Corrige MIME type para arquivos .mjs (ES modules)
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
