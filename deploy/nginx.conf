server {
    listen 80;
    server_name edtech-assess.duckdns.org 54.227.184.231 _;
    return 301 https://edtech-assess.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name edtech-assess.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/edtech-assess.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edtech-assess.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/edtech/dist;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        send_timeout          300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=edtech-app.apk" always;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
